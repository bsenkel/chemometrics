[package]
name = "chemometrics"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Spectral preprocessing and chemometric analysis, dependency-free by default"
readme = "README.md"
repository = "https://github.com/bsenkel/chemometrics"
keywords = ["chemometrics", "spectroscopy", "spectral-analysis", "signal-processing", "preprocessing"]
categories = ["science", "mathematics"]
exclude = [".github/", "AGENTS.md"]

[features]
pca = ["dep:faer"]

[dependencies]
faer = { version = "0.24", default-features = false, features = [
    "std",
    "linalg",
], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
